name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ── Static lint (abaplint + reviewdog) ──
  # Why not `abaplint/actions-abaplint@main`? Its bundled
  # @octokit/rest@16.10.0 silently fails to post Check annotations
  # (the `Hook()` repurposing warning). reviewdog posts findings
  # as PR review comments instead — visible on Files Changed (for
  # changed lines) AND as overall review comments (for findings
  # on unchanged files), so you actually see them on the PR.
  abaplint:
    name: abaplint
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install abaplint + reviewdog
        run: |
          npm install --no-save @abaplint/cli@latest
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run abaplint (checkstyle output)
        id: lint
        # abaplint exits non-zero when issues are found; we want to
        # capture the report and let reviewdog post it, so we don't
        # fail the step here. The job is gated by reviewdog's exit code.
        continue-on-error: true
        run: |
          npx abaplint --format checkstyle > abaplint.checkstyle.xml || true
          echo "── plain-text findings (for log scrollers) ──"
          npx abaplint || true

      - name: Post findings via reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # -reporter=github-pr-check creates a Check Run with annotations.
        # Visible in: (a) the PR's Checks tab → "abaplint" check (always),
        # (b) inline on Files Changed for findings on changed lines.
        # We previously used -reporter=github-pr-review, which silently
        # dropped findings on unchanged files (e.g. clas.abap when only
        # prog.abap is in the diff) — the Check Run reporter doesn't.
        # -filter-mode=nofilter keeps all findings, not just diff-touching ones.
        # -fail-level=error gates the PR on any error-severity finding.
        run: |
          cat abaplint.checkstyle.xml | reviewdog \
            -f=checkstyle \
            -name=abaplint \
            -reporter=github-pr-check \
            -filter-mode=nofilter \
            -fail-level=error

name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ── Static lint (the canonical abaplint action) ──
  # Annotates findings inline on the PR diff via the Checks API.
  # Config: ../../abaplint.jsonc at repo root.
  abaplint:
    name: abaplint
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is read-only on forked-PR runs — the action no-ops
    # the Checks annotation, but the exit code still gates the PR.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: abaplint/actions-abaplint@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

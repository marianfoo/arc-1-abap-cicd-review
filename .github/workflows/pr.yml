name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ── Static lint (abaplint + reviewdog) ──
  # Why not `abaplint/actions-abaplint@main`? Its bundled
  # @octokit/rest@16.10.0 silently fails to post Check annotations
  # (the `Hook()` repurposing warning). reviewdog posts findings
  # as PR review comments instead — visible on Files Changed (for
  # changed lines) AND as overall review comments (for findings
  # on unchanged files), so you actually see them on the PR.
  abaplint:
    name: abaplint
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install abaplint + reviewdog
        run: |
          npm install --no-save @abaplint/cli@latest
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run abaplint (checkstyle output)
        id: lint
        # abaplint exits non-zero when issues are found; we want to
        # capture the report and let reviewdog post it, so we don't
        # fail the step here. The job is gated by reviewdog's exit code.
        continue-on-error: true
        run: |
          npx abaplint --format checkstyle > abaplint.checkstyle.xml || true
          echo "── plain-text findings (for log scrollers) ──"
          npx abaplint || true

      - name: Post findings via reviewdog (Check Run annotations)
        id: reviewdog
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # -reporter=github-pr-check creates a Check Run with annotations.
        # Visible in: (a) the PR's Checks tab → "abaplint" check (always),
        # (b) inline on Files Changed for findings on changed lines.
        # -filter-mode=nofilter keeps all findings, not just diff-touching ones.
        # -fail-level=error makes reviewdog exit non-zero on findings — we
        # capture that in continue-on-error and gate the job at the end,
        # so the summary-comment step still runs.
        run: |
          cat abaplint.checkstyle.xml | reviewdog \
            -f=checkstyle \
            -name=abaplint \
            -reporter=github-pr-check \
            -filter-mode=nofilter \
            -fail-level=error

      - name: Build summary
        id: summary
        if: always() && hashFiles('abaplint.checkstyle.xml') != ''
        run: |
          python3 <<'PY' > /tmp/summary.md
          import xml.etree.ElementTree as ET
          import os

          tree = ET.parse('abaplint.checkstyle.xml')
          workspace = os.environ.get('GITHUB_WORKSPACE', '') + '/'
          findings = []
          for f in tree.findall('file'):
              path = (f.get('name') or '').removeprefix(workspace)
              for e in f.findall('error'):
                  findings.append((
                      e.get('severity', '?'),
                      path,
                      e.get('line', '?'),
                      (e.get('source') or '').split('.')[-1] or '?',
                      (e.get('message') or '').replace('|', '\\|'),
                  ))

          if not findings:
              print('## abaplint static-lint report\n\n_No findings._')
          else:
              print(f'## abaplint static-lint report')
              print()
              print(f'**{len(findings)} issue(s)** — full annotations on the '
                    f'[Checks tab](../checks). Inline review on files in this '
                    f'PR\'s diff is not possible for findings on **unchanged** '
                    f'files (GitHub API limitation).')
              print()
              print('| Severity | File | Line | Rule | Message |')
              print('|---|---|---|---|---|')
              for sev, path, line, rule, msg in findings:
                  print(f'| {sev} | `{path}` | {line} | `{rule}` | {msg} |')
          PY
          echo '── summary preview ──'
          cat /tmp/summary.md

      - name: Post / update sticky PR comment
        if: always() && github.event.pull_request.number != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: abaplint-summary
          path: /tmp/summary.md

      - name: Gate the job on findings
        if: steps.reviewdog.outcome == 'failure'
        run: |
          echo '::error::abaplint reported issues — see the sticky PR comment or Checks tab.'
          exit 1

name: Trigger Claude review

# Apply the `claude:review` label to a PR → Claude Code runs in CI,
# reads the diff, queries ARC-1 via MCP, posts ONE review comment via
# `gh pr comment`.
#
# Cost guardrails (see also .github/claude-review-prompt.md):
#   - --max-turns caps the agent loop length.
#   - allowedTools is a tight allowlist; Claude can't wander into other
#     ARC-1 tools or arbitrary Bash.
#   - The prompt explicitly budgets 2-5 tool calls and tells Claude to
#     post a single comment via gh CLI (instead of relying on the
#     action's built-in delivery heuristics, which were silent in
#     previous runs).

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude-review:
    if: github.event.label.name == 'claude:review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - name: Auto-remove the label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/issues/$PR/labels/claude:review" || true

      - name: Load review prompt
        id: prompt
        run: |
          {
            echo 'value<<__END_OF_PROMPT__'
            cat .github/claude-review-prompt.md
            echo '__END_OF_PROMPT__'
          } >> "$GITHUB_OUTPUT"

      - name: Write MCP config
        # Claude Code reads MCP servers from --mcp-config <path>, not from
        # the `settings` input (settings supports other Claude Code config
        # but our mcpServers there were silently ignored — we saw "MCP
        # server not registered" in prior runs even though the URL
        # substituted correctly into the settings JSON).
        env:
          ARC1_URL: ${{ vars.ARC1_URL }}
          ARC1_API_KEY: ${{ secrets.ARC1_API_KEY }}
        run: |
          cat > /tmp/mcp.json <<JSON
          {
            "mcpServers": {
              "arc-1": {
                "type": "http",
                "url": "$ARC1_URL/mcp",
                "headers": {
                  "Authorization": "Bearer $ARC1_API_KEY"
                }
              }
            }
          }
          JSON

      - uses: anthropics/claude-code-action@v1
        env:
          # Surface PR identifiers to Claude so the prompt's
          # `gh pr comment $PR_NUMBER ...` and `gh api ... pulls/$PR_NUMBER/reviews` work.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.prompt.outputs.value }}
          # claude_args breakdown:
          #   --model claude-sonnet-4-6   fast & cheap enough for review.
          #   --max-turns 15             cap on agent loop.
          #   --mcp-config /tmp/mcp.json  register the arc-1 MCP server.
          #   --allowedTools             tight allowlist: read-side ARC-1
          #                              tools the prompt asks for, plus
          #                              narrow `gh` subcommands for posting
          #                              the PR review (overall body +
          #                              inline comments via the reviews API).
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 15
            --mcp-config /tmp/mcp.json
            --allowedTools mcp__arc-1__SAPRead,mcp__arc-1__SAPDiagnose,mcp__arc-1__SAPNavigate,mcp__arc-1__SAPLint,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(cat:*),Bash(tee:*)

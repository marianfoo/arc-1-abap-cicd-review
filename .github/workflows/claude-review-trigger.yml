name: Trigger Claude review

# Apply the `claude:review` label to a PR → Claude Code runs in CI,
# reads the diff, queries ARC-1 via MCP, posts ONE review comment via
# `gh pr comment`.
#
# Cost guardrails (see also .github/claude-review-prompt.md):
#   - --max-turns caps the agent loop length.
#   - allowedTools is a tight allowlist; Claude can't wander into other
#     ARC-1 tools or arbitrary Bash.
#   - The prompt explicitly budgets 2-5 tool calls and tells Claude to
#     post a single comment via gh CLI (instead of relying on the
#     action's built-in delivery heuristics, which were silent in
#     previous runs).

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude-review:
    if: github.event.label.name == 'claude:review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - name: Auto-remove the label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/issues/$PR/labels/claude:review" || true

      - name: Load review prompt
        id: prompt
        run: |
          {
            echo 'value<<__END_OF_PROMPT__'
            cat .github/claude-review-prompt.md
            echo '__END_OF_PROMPT__'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          # Surface PR identifiers to Claude so the prompt's
          # `gh pr comment $PR_NUMBER ...` works.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.prompt.outputs.value }}
          # MCP config inline. ARC1_API_KEY is a plain repo secret.
          settings: |
            {
              "mcpServers": {
                "arc-1": {
                  "type": "http",
                  "url": "${{ vars.ARC1_URL }}/mcp",
                  "headers": {
                    "Authorization": "Bearer ${{ secrets.ARC1_API_KEY }}"
                  }
                }
              }
            }
          # claude_args breakdown:
          #   --model claude-sonnet-4-6   fast & cheap enough for review.
          #   --max-turns 8              cap agent loop. Previous unbounded
          #                              run hit ~10 turns and 478k tokens;
          #                              8 is enough for: read diff →
          #                              1-3 MCP calls → write review →
          #                              post via gh.
          #   --allowedTools             tight allowlist. Only the read-side
          #                              ARC-1 tools the prompt asks for,
          #                              plus a narrow `gh pr comment` for
          #                              the final post step.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 8
            --allowedTools mcp__arc-1__SAPRead,mcp__arc-1__SAPDiagnose,mcp__arc-1__SAPNavigate,mcp__arc-1__SAPLint,Bash(gh pr comment:*),Bash(gh pr diff:*)
